<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#004b2e">
  <title>Hacker House Goa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
  <style>
    :root { --yellow: #ffdc19; --pink: #f71375; --cream: #fff9e9; --green: #004b2e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--green); color: var(--cream); font-family: "DM Mono", monospace; }
    .hero { min-height: 100svh; isolation: isolate; position: relative; display: grid; place-items: center; overflow: hidden; padding: 28px; }
    .hero-video { position: absolute; inset: 0; z-index: -3; width: 100%; height: 100%; object-fit: cover; transition: opacity .8s ease-in-out; }
    .hero-video.is-hidden { opacity: 0; }
    .overlay { position: absolute; inset: 0; z-index: -2; background: linear-gradient(120deg, rgba(0, 49, 30, .87), rgba(0, 72, 40, .6) 46%, rgba(0, 35, 24, .86)); }
    .grain { position: absolute; inset: 0; z-index: -1; opacity: .18; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,.85) .65px, transparent .65px); background-size: 5px 5px; mix-blend-mode: soft-light; }
    .topline { position: absolute; top: 30px; left: 34px; right: 34px; display: flex; align-items: center; justify-content: space-between; gap: 18px; font-size: clamp(.62rem, 1.2vw, .82rem); letter-spacing: .12em; text-transform: uppercase; }
    .studio { color: var(--yellow); font-weight: 500; line-height: 1.25; }
    .edition { opacity: .9; }
    .content { width: min(760px, 100%); text-align: center; display: grid; justify-items: center; gap: clamp(20px, 4vh, 36px); transform: translateX(-8vw); }
    .mark-wrap { position: relative; width: min(980px, 96vw); animation: enter .75s ease-out both; }
    .house-title { color: var(--yellow); font-family: "Playfair Display", Georgia, serif; font-size: clamp(5.4rem, 17.5vw, 13.5rem); font-weight: 900; letter-spacing: -.09em; line-height: .61; text-align: center; text-transform: uppercase; text-shadow: 0 12px 22px rgba(0,0,0,.26); transform: translateY(-.07em); }
    .house-title span { display: block; }
    .house-title span:first-child { transform: translateY(-.07em); }
    .house-title span:last-child { transform: translateY(.09em); }
    .goa-mark { position: absolute; z-index: 1; top: 50%; left: 50%; width: min(170px, 23vw); transform: translate(-50%, -50%); filter: drop-shadow(0 8px 10px rgba(0,0,0,.23)); animation: float 3.1s ease-in-out infinite; }
    .tagline { margin: 0; max-width: 560px; font-size: clamp(.75rem, 1.65vw, 1rem); line-height: 1.65; letter-spacing: .08em; text-transform: uppercase; text-wrap: balance; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 27px; border: 2px solid var(--yellow); color: var(--green); background: var(--yellow); text-decoration: none; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; transition: transform .18s ease, background .18s ease, color .18s ease; }
    .button:hover, .button:focus-visible { transform: translateY(-3px); background: var(--pink); border-color: var(--pink); color: #fff; outline: none; }
    .details { font-size: .72rem; letter-spacing: .11em; text-transform: uppercase; color: var(--yellow); }
    @keyframes enter { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0%, 100% { transform: translate(-50%, -50%) translateY(-7px); } 50% { transform: translate(-50%, -50%) translateY(7px); } }
    @media (max-width: 600px) { .hero { padding: 24px 18px; } .topline { top: 20px; left: 20px; right: 20px; } .edition { display: none; } .content { transform: translateX(-2vw); } .button { width: min(100%, 290px); } }
    @media (prefers-reduced-motion: reduce) { .mark-wrap, .goa-mark { animation: none; } .button { transition: none; } }
  </style>
</head>
<body>
  <main class="hero">
    <video class="hero-video" id="heroVideoA" autoplay muted playsinline poster="assets/hacker-house-goa-builders.png" aria-hidden="true">
      <source src="assets/hacker-house-goa.mp4" type="video/mp4">
    </video>
    <video class="hero-video is-hidden" id="heroVideoB" muted playsinline poster="assets/hacker-house-goa-builders.png" aria-hidden="true">
      <source src="assets/hacker-house-goa.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="grain"></div>
    <header class="topline">
      <span class="studio">2:47 PM<br>Studio</span>
      <span class="edition">Goa, India · 28–31 Oct 2026</span>
    </header>
    <section class="content" aria-label="Hacker House Goa">
      <div class="mark-wrap" aria-label="Hacker House Goa">
        <div class="house-title" aria-label="Hacker House"><span>Hacker</span><span>House</span></div>
        <img class="goa-mark" src="assets/goa-mark.png" alt="Goa">
      </div>
      <p class="tagline">A house by the sea for people who make things happen.</p>
      <div class="actions">
        <a class="button" href="/hacker_goa_house_form_4.html" target="_parent">Build your pass →</a>
      </div>
      <div class="details">Goa, India · 28–31 Oct 2026</div>
    </section>
  </main>
  <script>
    // Crossfade into a fresh copy of the clip before the current copy ends.
    // This keeps the moving background continuous, without a hard loop cut.
    const videos = [document.getElementById('heroVideoA'), document.getElementById('heroVideoB')];
    const fadeDuration = 0.8;
    let activeIndex = 0;
    let loopTimer;

    function scheduleCrossfade() {
      const current = videos[activeIndex];
      clearTimeout(loopTimer);
      loopTimer = setTimeout(crossfade, Math.max(0, (current.duration - fadeDuration) * 1000));
    }

    function crossfade() {
      const outgoing = videos[activeIndex];
      const incoming = videos[1 - activeIndex];
      incoming.currentTime = 0;
      incoming.play();
      incoming.classList.remove('is-hidden');
      outgoing.classList.add('is-hidden');
      setTimeout(() => {
        outgoing.pause();
        outgoing.currentTime = 0;
        activeIndex = 1 - activeIndex;
        scheduleCrossfade();
      }, fadeDuration * 1000);
    }

    videos[0].addEventListener('loadedmetadata', scheduleCrossfade, { once: true });
    videos[0].addEventListener('ended', crossfade);
  </script>
</body>
</html>
